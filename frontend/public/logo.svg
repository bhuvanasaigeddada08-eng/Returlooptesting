<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vibrant Blue-to-Cyan-to-Teal Gradient -->
    <linearGradient id="return-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Secondary Cyan-to-Blue Gradient -->
    <linearGradient id="return-gradient-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Premium Container Background -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="white" stroke-opacity="0.1" stroke-width="2" />

  <!-- Outer Return Orbit (Clockwise Flow) -->
  <!-- Top Loop & Arrow -->
  <path d="M 28 52 C 28 35, 42 24, 60 24 C 74 24, 82 33, 82 44 C 82 56, 70 64, 52 74 C 40 80, 24 76, 24 64" 
        stroke="url(#return-gradient-1)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#soft-glow)" />

  <!-- Arrowhead 1 (Returning forward at top right) -->
  <path d="M 76 34 L 84 44 L 73 48" 
        stroke="url(#return-gradient-1)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bottom Return Loop & Arrow -->
  <path d="M 72 48 C 72 65, 58 76, 40 76 C 26 76, 18 67, 18 56 C 18 44, 30 36, 48 26 C 60 20, 76 24, 76 36" 
        stroke="url(#return-gradient-2)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-dasharray="1 1" />

  <!-- Center Verification Beacon (Found / Verified Pin) -->
  <circle cx="50" cy="50" r="7" fill="#f59e0b" filter="url(#soft-glow)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
